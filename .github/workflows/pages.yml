name: Zwemstad publiceren en roosters verversen
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3,9,15,21 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zwemstad-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: read
    outputs:
      source_health: ${{ steps.health.outcome }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Pages-instellingen
        id: pages
        uses: actions/configure-pages@v5
      - run: npm ci --no-audit --no-fund
      - run: npm run sync
      - run: npm run check
      - run: npm test
      - name: Nieuwe roosters en bronstatus bewaren
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/schedule.json
          if ! git diff --cached --quiet; then
            git commit -m 'Werk zwemroosters en bronstatus bij'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Bronstatus controleren
        id: health
        continue-on-error: true
        run: npm run health
      - name: Installeerbare website bouwen
        run: npm run build:web
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publiceren
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Eventuele bronuitval melden
        if: needs.build.outputs.source_health != 'success'
        run: |
          echo 'De app is gepubliceerd, maar een bron kon niet worden bijgewerkt. Controleer de bronstatus.'
          exit 1
